# ╔══════════════════════════════════════════════════════════════════╗
# ║                                                                    ║
# ║                       C L O U D F A L L   C O R E                  ║
# ║                A Living World Engine for your server               ║
# ║                                                                    ║
# ║   Author : laalaalaee                                              ║
# ║   GitHub : https://github.com/laalaalaee/cloudfall-core-plugin     ║
# ║                                                                    ║
# ║   EVERYTHING here is editable. Tune it to fit your server, big     ║
# ║   or small. Reload changes live with: /cloudfall reload            ║
